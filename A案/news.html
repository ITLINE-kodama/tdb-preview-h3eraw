<script>(function(){const SS='pv_xvq6nssr';const raw=Uint8Array.from(atob(document.getElementById('payload').textContent.trim()),c=>c.charCodeAt(0));const salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
async function tryOpen(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);const html=new TextDecoder('utf-8').decode(pt);try{localStorage.setItem(SS,pw)}catch(e){}document.open();document.write(html);document.close()}
function showGate(){document.getElementById('load').style.display='none';document.getElementById('gate').style.display='block'}
window.addEventListener('load',async()=>{let s=null;try{s=localStorage.getItem(SS)}catch(e){}if(s){try{await tryOpen(s);return}catch(e){try{localStorage.removeItem(SS)}catch(_){}}}showGate()});
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();document.getElementById('msg').textContent='復号しています...';try{await tryOpen(document.getElementById('pw').value)}catch(err){document.getElementById('msg').textContent='パスワードが正しくありません。'}});})();</script></body></html>
